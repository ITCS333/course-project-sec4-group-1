<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Details</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="details.js" defer></script>
</head>
<body>

<header>
    <h1 id="assignment-title">Loading Assignment...</h1>
</header>

<main>
    <p id="assignment-due-date"></p>
    <p id="assignment-description"></p>
    
    <h3>Reference Files</h3>
    <ul id="assignment-files-list"></ul>

    <section id="discussion-forum">
        <h2>Questions & Discussion</h2>
        
        <div id="comment-list">
            <!-- Comments will be injected here by details.js -->
        </div>

        <form id="comment-form" action="#">
            <fieldset>
                <legend>Post a Comment</legend>
                
                <label for="new-comment">Your Comment</label>
                <textarea id="new-comment" required placeholder="Ask a question or share a thought..."></textarea>
                
                <button type="submit">Post Comment</button>
            </fieldset>
        </form>
    </section>
</main>

</body>
</html>
