<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Board</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="board.js" defer></script>
</head>
<body>
    <header class="container">
        <h1>Community Discussion Board</h1>
    </header>

    <main class="container">
        <section aria-labelledby="form-heading">
            <h2 id="form-heading">Start a New Conversation</h2>
            <form id="new-topic-form" action="#">
                <fieldset>
                    <legend>New Topic Details</legend>

                    <label for="topic-subject">Subject</label>
                    <input type="text" id="topic-subject" name="subject" placeholder="What is on your mind?" required>

                    <label for="topic-message">Message</label>
                    <textarea id="topic-message" name="message" rows="5" placeholder="Provide more details here..." required></textarea>
                    
                    <button id="create-topic" type="submit">Create Topic</button>
                </fieldset>
            </form>
        </section>

        <hr>

        <section aria-labelledby="topics-heading">
            <h2 id="topics-heading">All Topics</h2>
            <div id="topic-list-container" class="grid"></div>
        </section>
    </main>

    <footer class="container">
        <p>&copy; 2026 Discussion Portal</p>
    </footer>
</body>
</html>
