<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Topic</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="topic.js" defer></script>
</head>
<body>
    <header class="container">
        <nav>
            <a href="board.html">← Back to Board</a>
        </nav>
        <h1 id="topic-subject">Loading Topic...</h1>
    </header>

    <main class="container">
        <article id="original-post">
            <p id="op-message"></p>
            <footer id="op-footer"></footer>
        </article>

        <section id="replies-section">
            <h2>Replies</h2>
            
            <div id="reply-list-container"></div>

            <form id="reply-form" action="#">
                <fieldset>
                    <legend>Your Reply</legend>
                    
                    <label for="new-reply">Reply Message</label>
                    <textarea id="new-reply" name="reply" rows="4" placeholder="Write your response here..." required></textarea>
                    
                    <button type="submit">Post Reply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer class="container">
        <p>&copy; 2026 Discussion Portal</p>
    </footer>
</body>
</html>
