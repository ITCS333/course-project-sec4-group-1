<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
    <script src="details.js" defer></script>
    <link rel="stylesheet" href="../common/styles.css">
</head>
<body>

    <header>
        <h1 id="resource-title">Loading Resource...</h1>
    </header>

    <main>
        <p id="resource-description"></p>
        <a id="resource-link" href="#" target="_blank">Access Resource Material</a>

        <section id="discussion-forum">
            <h2>Discussion</h2>
            
            <div id="comment-list">
                <!-- Comments injected by details.js -->
            </div>

            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>
                    
                    <label for="new-comment">Comment</label>
                    <textarea id="new-comment" required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>

</body>
</html>
