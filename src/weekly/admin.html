<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Management - Admin</title>
    <link rel="stylesheet" href="../common/styles.css">
    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Course Administration</h1>
    </header>

    <main>
        <section>
            <h2>Add or Edit Week</h2>
            <form id="week-form">
                <fieldset>
                    <legend>Weekly Details</legend>
                    
                    <label for="week-title">Week Title</label>
                    <input type="text" id="week-title" required>

                    <label for="week-start-date">Start Date</label>
                    <input type="date" id="week-start-date" required>

                    <label for="week-description">Description</label>
                    <textarea id="week-description" rows="3"></textarea>

                    <label for="week-links">Exercises & Resources (One URL per line)</label>
                    <textarea id="week-links" rows="3"></textarea>

                    <button id="add-week" type="submit">Save Week</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Existing Weeks</h2>
            <table id="weeks-table">
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Start Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="weeks-tbody">
                    </tbody>
            </table>
        </section>
    </main>

</body>
</html>
