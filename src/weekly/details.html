<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Details & Discussion</title>
    <link rel="stylesheet" href="../common/style.css">
    <script src="details.js" defer></script>
</head>
<body>

    <header>
        <h1 id="week-title">Loading Title...</h1>
    </header>

    <main>
        <p id="week-start-date"></p>
        <p id="week-description"></p>
        
        <h3>Resources & Links</h3>
        <ul id="week-links-list"></ul>

        <section id="discussion-forum">
            <h2>Discussion</h2>
            
            <div id="comment-list">
                </div>

            <form id="comment-form">
                <fieldset>
                    <legend>Leave a Comment</legend>
                    
                    <label for="new-comment">Your Comment</label>
                    <textarea id="new-comment" required placeholder="Write your thoughts here..."></textarea>
                    
                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>

</body>
</html>
